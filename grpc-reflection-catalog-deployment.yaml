kind: Deployment
apiVersion: apps/v1
metadata:
  name: grpc-reflection-catalog
  namespace: controls-appdev
  labels:
    app: grpc-reflection-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-reflection-catalog
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grpc-reflection-catalog
        app.kubernetes.io/instance: grpc-reflection-catalog
    spec:
      containers:
        - name: grpc-reflection-catalog
          # The tag :1 is a placeholder; Flux ImagePolicy will manage this
          image: adregistry.fnal.gov/applications/reflection-catalog:1 # {"$imagepolicy": "flux-system:reflection-catalog"}
          ports:
            - containerPort: 50051
          env:
            - name: PROTO_PATH
              value: "/etc/protos/interface-definitions/proto"
          volumeMounts:
            - name: proto-storage
              mountPath: /etc/protos

        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          args:
            - --repo=https://github.com/fermi-ad/interface-definitions
            - --branch=main
            - --wait=300
            - --root=/etc/protos
          volumeMounts:
            - name: proto-storage
              mountPath: /etc/protos

      volumes:
        - name: proto-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reflection-catalog
  namespace: controls-appdev
  labels:
    app: grpc-reflection-catalog
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app: grpc-reflection-catalog

